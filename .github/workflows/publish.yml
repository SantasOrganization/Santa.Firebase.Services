name: Publish Santa.Firebase.Services to NuGet

on:
  # Triggers automatically when you push commits to main branch (e.g. from VS Code)
  push:
    branches:
      - main

  # Triggers when you publish a new Release in GitHub
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # These permissions are strictly required for NuGet Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build project
        run: dotnet build --configuration Release

      - name: Pack project
        # Packs the library and outputs the .nupkg file into a specific folder
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      - name: Publish to NuGet.org
        # Pushes the package to NuGet.org via Trusted Publishing (OIDC)
        # --skip-duplicate ensures it won't fail if the same version was already pushed
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
